# Lint, typecheck, test and build every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # vitest and tsup need Node 22.12 or later.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # npm rewrites package.json fields it finds malformed while publishing (1.2.1 went out with a
      # warning that its "./"-prefixed bin was removed): keep the file as `npm pkg fix` writes it.
      - run: npm pkg fix && git diff --exit-code package.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # package.json promises Node.js 18 and later, older than the tools run on: build with a current
  # Node, then load and run what npm ships on the oldest ones.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run smoke
